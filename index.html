:root{color-scheme:dark;--void:#050302;--cu:#e8a47c;--cu-dim:#5a2e18;--cu-hot:#ffd2b0;--g:clamp(10px,2.5vw,24px)}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.gl{display:block;overflow:visible}
#stage{position:fixed;inset:0;cursor:default}
#frame{position:absolute;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;background:var(--void)}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* small copper buttons: SOUND (bottom right) and SYSTEM (top right) share one size */
.ntb{position:relative;box-sizing:border-box;width:68px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;font:500 7.7px/1 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;color:var(--cu);background:rgba(10,5,3,.55);border:1px solid var(--cu-dim);cursor:pointer}
.ntb::after{content:"";position:absolute;inset:-9px}
@media (hover:hover) and (pointer:fine){.ntb:hover{border-color:var(--cu)}}
.ntb:focus-visible{outline:1px solid var(--cu);outline-offset:2px}
#snd{position:absolute;right:var(--g);bottom:var(--g);transition:opacity .3s}
#snd[data-on="1"]{color:var(--cu-hot);border-color:var(--cu)}
#snd.dim{opacity:.2;transition:opacity 3s ease-in-out}
#snd.dim:focus-visible,#stage.awake #snd.dim{opacity:1;transition:opacity .25s}
/* hovering brings it back only with a real mouse: phones keep a tapped button "hovered", which would stop the fade */
@media (hover:hover) and (pointer:fine){#snd.dim:hover{opacity:1;transition:opacity .25s}}
/* SYSTEM menu: a column of three cells, ANTICONTAINMENT attached down the outside of its right edge */
#sys{position:absolute;top:var(--g);right:var(--g);width:68px}
/* the menu and the sound button sit above the modal backdrop: both stay lit and usable while a modal is open */
#stage #sys,#stage #snd{z-index:21}
#sys.open #sysBtn{color:var(--cu-hot);border-color:var(--cu)}
#sysMenu{position:relative;width:68px;height:168px;opacity:0;pointer-events:none;perspective:260px}
#sys.open #sysMenu{pointer-events:auto}
.rails{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:2}
.rail{fill:none;stroke:#b8683e;stroke-width:1}
.cell{position:absolute;left:0;width:68px;height:56px;padding:0;border:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,3,.62);color:var(--cu);font:500 15px/1 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.04em;cursor:pointer;opacity:0;transform-origin:50% 50%}
.cell span{display:block;opacity:0;backface-visibility:hidden}
.cell:hover{color:var(--cu-hot);box-shadow:inset 0 0 14px rgba(232,164,124,.3)}
.cell:focus-visible{outline:1px solid var(--cu);outline-offset:-4px}
.word{position:absolute;left:68px;top:0;color:var(--cu);pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.85))}
.word .lt{opacity:0}
/* desktop timecode */
#hud{position:absolute;left:50%;bottom:clamp(12px,4%,28px);transform:translateX(-50%);display:grid;gap:6px;justify-items:center;opacity:0;transition:opacity .6s;pointer-events:none;font:500 12px/1 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--cu);text-shadow:0 0 6px #000}
#hud.on{opacity:.9}
#hudTrack{width:min(220px,40vw);height:2px;background:#3a1d10}
#hudBar{height:100%;width:0;background:var(--cu)}
#hudKeys{color:#9a6448;font-size:10px;white-space:nowrap}
/* phones: a touch control bar instead, shown with a tap */
#mhud{display:none}
.mobile #hud{display:none}
.mobile #mhud{position:absolute;left:50%;bottom:calc(var(--g) + 34px);width:min(460px,calc(100vw - 2 * var(--g)));box-sizing:border-box;padding:10px 12px 12px;display:grid;gap:8px;background:rgba(10,5,3,.62);border:1px solid var(--cu-dim);color:var(--cu);font:500 11px/1 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.06em;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .35s,transform .35s}
.mobile #stage.awake #mhud{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.mrow{display:flex;align-items:center;gap:10px}
.mrow.btns{justify-content:center;gap:12px}
#mTime,#mDur{min-width:2.8em;font-variant-numeric:tabular-nums}
#mDur{text-align:right;color:#9a6448}
#mTrack{position:relative;flex:1;height:30px;touch-action:none;cursor:pointer}
#mTrack::before{content:"";position:absolute;left:0;right:0;top:14px;height:2px;background:#3a1d10}
#mFill{position:absolute;left:0;top:14px;height:2px;width:0;background:var(--cu)}
#mThumb{position:absolute;top:9px;left:0;width:12px;height:12px;margin-left:-6px;background:var(--cu);box-shadow:0 0 8px rgba(232,164,124,.55)}
#mTrack.drag #mThumb{background:var(--cu-hot);transform:scale(1.25)}
.mb{width:52px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,3,.55);border:1px solid var(--cu-dim);color:var(--cu);font:500 11px/1 ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;letter-spacing:.04em;cursor:pointer}
.mb:active{border-color:var(--cu);color:var(--cu-hot)}
.mb svg{width:14px;height:14px;fill:currentColor}
#mPlay{width:60px}
/* modals: always square and centred; compact on desktop, screen-wide on phones */
#modals{position:fixed;inset:0;z-index:20}
#modals[hidden],.mpanel[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(4,2,1,.5)}
.mseed{position:absolute;left:0;top:0;width:18px;height:18px;background:rgba(255,190,140,.95);box-shadow:0 0 14px 3px rgba(255,160,100,.55);opacity:0;pointer-events:none}
.mpanel{--s:min(520px,72vh,72vw);position:absolute;left:50%;top:50%;width:var(--s);height:var(--s);transform:translate(-50%,-50%);box-sizing:border-box;display:flex;flex-direction:column;background:rgba(10,5,3,.94);border:1px solid #b8683e;color:#ecc3a4;font:400 16px/1.6 'Midnight Letters',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace}
.mobile .mpanel{--s:min(calc(100vw - 2 * var(--g)),calc(100vh - 2 * var(--g)))}
@supports (height:100dvh){.mobile .mpanel{--s:min(calc(100vw - 2 * var(--g)),calc(100dvh - 2 * var(--g)))}}
.mhead{position:relative;display:flex;align-items:stretch;justify-content:space-between;height:56px;flex:none;border-bottom:1px solid #b8683e}
.mtitle{margin:0;display:flex;align-items:center;padding:0 20px;color:var(--cu);font:inherit}
.mtitle .lt{opacity:0}
.mclose{width:56px;height:56px;flex:none;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-left:1px solid #b8683e;color:var(--cu);cursor:pointer;perspective:200px}
.mclose:hover{color:var(--cu-hot);background:rgba(232,164,124,.12)}
.mclose:focus-visible{outline:1px solid var(--cu);outline-offset:-6px}
.ntt{display:block}
.mbody{flex:1;overflow:auto;padding:20px 22px 24px;outline:none;scrollbar-width:thin;scrollbar-color:#5a2e18 transparent}
.mbody p{margin:0 0 1em}
.mglow{position:absolute;inset:-1px;pointer-events:none;border:1px solid #ffd2b0;box-shadow:inset 0 0 40px rgba(255,170,110,.45),0 0 18px rgba(255,170,110,.35);opacity:0}
.cell.on{color:var(--cu-hot);box-shadow:inset 0 0 0 1px var(--cu),inset 0 0 14px rgba(232,164,124,.3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
@media (prefers-reduced-motion: reduce){#snd.dim,#mhud{transition:none}}

proaches meet within the same work.", "The physical and virtual are treated as parts of one larger visual language. A form developed as a three-dimensional model can become a physical object. A handmade drawing or texture can become part of an animation or digital composition. Physical materials can be photographed, scanned, transformed, projected or recombined, while virtual designs can become objects through fabrication and other production methods. The direction of movement can go either way.", "This allows NINETENTWO to choose a medium because of what an idea requires rather than allowing a particular medium to determine the idea. The practice can move from stone, wood, pigment and paper to pixels, polygons, algorithms and generated imagery\u2014and into the territory between them. As new tools and methods appear, they become additional possibilities within an expanding multidisciplinary visual practice."]}];
